name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-cli.yml'
      - 'scripts/release/**'
      - 'packaging/**'
      - 'compute/officejs/Cargo.toml'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: metadata
        name: Read release metadata
        shell: python
        run: |
          import json, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('compute/officejs/Cargo.toml').read_text())['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match the Cargo package version'
          targets = json.loads(Path('scripts/release/targets.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': targets}), file=output)
              print('version=' + version, file=output)

  build:
    needs: prepare
    name: Native / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target-native'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and test native CLI
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = win32 ]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo build -p mog --release --locked --target '${{ matrix.target }}'
          cargo test -p mog --release --locked --target '${{ matrix.target }}' --test cli_interface
      - name: Package and test installed CLI
        shell: bash
        run: |
          binary='target-native/${{ matrix.target }}/release/mog'
          if [ '${{ matrix.platform }}' = win32 ]; then binary="$binary.exe"; fi
          python scripts/release/package.py --target '${{ matrix.target }}' --binary "$binary"
          python scripts/release/package.py
          python scripts/release/smoke.py --target '${{ matrix.target }}'
          # The identical launcher is packaged once again in the assemble job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mog-${{ matrix.target }}
          path: |
            artifacts/release/*
            !artifacts/release/mog-sdk-cli-${{ needs.prepare.outputs.version }}.tgz
          if-no-files-found: error

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mog-*
          path: artifacts/release
          merge-multiple: true
      - name: Assemble release
        run: |
          python3 scripts/release/package.py
          python3 scripts/release/check.py
          cd artifacts/release
          sha256sum *.tar.gz *.zip *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mog-release
          path: artifacts/release/*
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mog-release
          path: artifacts/release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --draft \
            --title "Mog $RELEASE_TAG" --notes-file docs/release-notes-1.0.md
