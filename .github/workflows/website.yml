name: Website

# Manual publish only. Limit who can start it to repository admins with an
# Actions execution policy on this file. The deploy job still waits on the
# github-pages environment.
on:
  workflow_dispatch:

# A newer run waits. An in-progress Pages deploy is not cancelled.
concurrency:
  group: website-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run the Website workflow from the main branch. Refusing ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble and check the page
        run: |
          sh website/assemble.sh
          python3 website/check.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
