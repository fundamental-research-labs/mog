[package]
name = "mog"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Mog spreadsheet engine with an embedded Office.js Excel API"

[[bin]]
name = "mog"
path = "src/main.rs"

[dependencies]
compute-api = { path = "../api" }
domain-types = { path = "../../domain-types" }
value-types = { path = "../core/crates/types/value-types" }
regex = "1"
rquickjs = { version = "0.12.2", features = ["futures"] }
tokio = { version = "1", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
xlsx-parser = { path = "../../file-io/xlsx/parser" }
